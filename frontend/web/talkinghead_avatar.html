<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InterviewMate Talking Avatar</title>
  <style>
    html, body, #avatar {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    body {
      background:
        radial-gradient(circle at 50% 16%, rgba(255, 255, 255, 0.18), transparent 28%),
        linear-gradient(180deg, rgba(2, 6, 23, 0.02), rgba(2, 6, 23, 0.48)),
        url("./talkinghead/interview_room.jpg");
      background-size: cover;
      background-position: center;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: white;
      background: rgba(2, 6, 23, 0.48);
      font-size: 14px;
      letter-spacing: 0;
    }

    #status {
      position: absolute;
      right: 16px;
      top: 16px;
      padding: 8px 12px;
      border-radius: 999px;
      color: white;
      background: rgba(16, 185, 129, 0.88);
      font: 700 13px Arial, sans-serif;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 160ms ease, transform 160ms ease;
      pointer-events: none;
    }

    #status.listening {
      background: rgba(14, 165, 233, 0.90);
    }

    #status.thinking {
      background: rgba(99, 102, 241, 0.92);
    }

    #status.speaking {
      background: rgba(16, 185, 129, 0.90);
    }

    #status.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #presence {
      position: absolute;
      left: 18px;
      bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.92);
      font: 700 12px Arial, sans-serif;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
      pointer-events: none;
    }

    #presence::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 14px rgba(34, 197, 94, 0.85);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./talkinghead/node_modules/three/build/three.module.js",
        "three/addons/": "./talkinghead/node_modules/three/examples/jsm/",
        "talkinghead": "./talkinghead/modules/talkinghead.mjs?v=6"
      }
    }
  </script>
</head>
<body>
  <div id="avatar"></div>
  <div id="loading">Loading interviewer...</div>
  <div id="status">Speaking</div>
  <div id="presence">AI Interviewer</div>

  <script type="module">
    import { TalkingHead } from "talkinghead";

    const loading = document.getElementById("loading");
    const status = document.getElementById("status");
    const avatar = document.getElementById("avatar");
    let head = null;
    let ready = false;
    let visemeTimers = [];
    const visemeNames = [
      "viseme_PP", "viseme_FF", "viseme_TH", "viseme_DD", "viseme_kk",
      "viseme_CH", "viseme_SS", "viseme_nn", "viseme_RR", "viseme_aa",
      "viseme_E", "viseme_I", "viseme_O", "viseme_U", "viseme_sil",
      "jawOpen", "mouthOpen", "mouthFunnel", "mouthPucker"
    ];

    // Per-viseme intensity and jaw params for natural mouth shapes
    const visemeConfig = {
      // Vowels — each gets distinct mouth shape
      'aa': { value: 0.52, jaw: 0.22, mouth: 0.18 },   // open "ah"
      'E':  { value: 0.40, jaw: 0.13, mouth: 0.10 },   // spread "eh"
      'I':  { value: 0.32, jaw: 0.09, mouth: 0.06 },   // narrow "ee"
      'O':  { value: 0.50, jaw: 0.20, mouth: 0.16 },   // rounded "oh"
      'U':  { value: 0.45, jaw: 0.12, mouth: 0.14 },   // pursed "oo"
      // Consonants
      'PP': { value: 0.85, jaw: 0.02, mouth: 0.01 },   // lips press
      'FF': { value: 0.80, jaw: 0.04, mouth: 0.02 },   // bite lip
      'TH': { value: 0.24, jaw: 0.08, mouth: 0.05 },   // tongue tip (reduced)
      'DD': { value: 0.26, jaw: 0.10, mouth: 0.06 },   // tongue tap (reduced)
      'kk': { value: 0.38, jaw: 0.10, mouth: 0.06 },   // back tongue
      'CH': { value: 0.45, jaw: 0.08, mouth: 0.05 },   // "ch/sh"
      'SS': { value: 0.28, jaw: 0.06, mouth: 0.04 },   // sibilant
      'nn': { value: 0.22, jaw: 0.06, mouth: 0.04 },   // nasal (reduced tongue)
      'RR': { value: 0.28, jaw: 0.09, mouth: 0.06 },   // "r" (reduced tongue)
      'sil':{ value: 0.00, jaw: 0.00, mouth: 0.00 },   // silence
    };

    function showStatus(show) {
      status.classList.toggle("visible", !!show);
    }

    function setStateLabel(state) {
      status.classList.remove("listening", "thinking", "speaking");
      if (state === "listening") {
        status.textContent = "Listening";
        status.classList.add("listening");
        showStatus(true);
      } else if (state === "thinking") {
        status.textContent = "Thinking";
        status.classList.add("thinking");
        showStatus(true);
      } else if (state === "speaking") {
        status.textContent = "Speaking";
        status.classList.add("speaking");
        showStatus(true);
      } else {
        showStatus(false);
      }
    }

    function wordsFromText(text, targetMs) {
      const words = String(text || "")
        .replace(/[^\p{L}\p{N}'-]+/gu, " ")
        .trim()
        .split(/\s+/)
        .filter(Boolean);
      let time = 0;
      const wtimes = [];
      const wdurations = [];
      for (const word of words) {
        wtimes.push(time);
        wdurations.push(Math.max(240, Math.min(620, 80 + word.length * 48)));
        time += Math.max(260, Math.min(680, 90 + word.length * 54));
      }
      // Scale the heuristic timeline to the ACTUAL TTS audio duration so the
      // mouth stays aligned with the voice for the whole utterance.
      const estimated = time;
      if (targetMs && targetMs > 200 && estimated > 0) {
        const f = targetMs / estimated;
        for (let i = 0; i < wtimes.length; i++) {
          wtimes[i] *= f;
          wdurations[i] *= f;
        }
      }
      return { words, wtimes, wdurations };
    }

    function clearMouth() {
      visemeTimers.forEach((timer) => window.clearTimeout(timer));
      visemeTimers = [];
      window.clearTimeout(window.__speakingTimer);
      if (!head) return;
      visemeNames.forEach((name) => head.setFixedValue(name, null, 70));
    }

    function scheduleViseme(name, value, at, hold, visemeKey) {
      const cfg = visemeConfig[visemeKey] || { value: 0.40, jaw: 0.12, mouth: 0.08 };
      const intensity = cfg.value;
      const jawVal = cfg.jaw;
      const mouthVal = cfg.mouth;

      // Onset: ease into the shape
      visemeTimers.push(window.setTimeout(() => {
        if (!head) return;
        // Clear previous visemes with smooth fade
        visemeNames.forEach((target) => head.setFixedValue(target, null, 80));
        // Set this viseme with natural transition
        head.setFixedValue(name, intensity, 90);
        head.setFixedValue("jawOpen", jawVal, 90);
        head.setFixedValue("mouthOpen", mouthVal, 90);
        // Add subtle mouthFunnel for rounded vowels
        if (visemeKey === 'O' || visemeKey === 'U') {
          head.setFixedValue("mouthFunnel", 0.15, 90);
          head.setFixedValue("mouthPucker", visemeKey === 'U' ? 0.20 : 0.10, 90);
        }
      }, Math.max(0, at)));

      // Offset: smooth release
      visemeTimers.push(window.setTimeout(() => {
        if (!head) return;
        head.setFixedValue(name, null, 120);
        head.setFixedValue("jawOpen", null, 120);
        head.setFixedValue("mouthOpen", null, 120);
        head.setFixedValue("mouthFunnel", null, 120);
        head.setFixedValue("mouthPucker", null, 120);
      }, Math.max(0, at + hold)));
    }

    function animateVisemesFromText(text, targetMs) {
      clearMouth();
      const timing = wordsFromText(text, targetMs);
      let lastTime = 0;

      timing.words.forEach((word, index) => {
        const raw = head.lipsyncPreProcessText(word, "en");
        const sequence = head.lipsyncWordsToVisemes(raw, "en");
        const wordStart = timing.wtimes[index];
        const wordDuration = timing.wdurations[index];

        if (!sequence?.visemes?.length) {
          scheduleViseme("jawOpen", 0.12, wordStart, Math.max(120, wordDuration * 0.55), 'aa');
          lastTime = Math.max(lastTime, wordStart + wordDuration);
          return;
        }

        const sequenceEnd = sequence.times[sequence.times.length - 1] +
          sequence.durations[sequence.durations.length - 1];
        const scale = sequenceEnd > 0 ? wordDuration / sequenceEnd : 1;

        sequence.visemes.forEach((viseme, visemeIndex) => {
          if (viseme === "sil") return;
          const name = `viseme_${viseme}`;
          const at = wordStart + (sequence.times[visemeIndex] * scale);
          const hold = Math.max(95, sequence.durations[visemeIndex] * scale);
          const cfg = visemeConfig[viseme] || { value: 0.40 };
          scheduleViseme(name, cfg.value, at, hold, viseme);
          lastTime = Math.max(lastTime, at + hold);
        });
      });

      window.__speakingTimer = window.setTimeout(() => {
        clearMouth();
        showStatus(false);
      }, Math.max(1200, lastTime + 260));
    }

    async function init() {
      head = new TalkingHead(avatar, {
        lipsyncModules: ["en"],
        lipsyncLang: "en",
        cameraView: "head",
        cameraDistance: -0.26,
        cameraY: 0.045,
        cameraRotateEnable: false,
        cameraPanEnable: false,
        cameraZoomEnable: false,
        modelFPS: 30,
        modelPixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
        avatarIdleEyeContact: 0.97,
        avatarIdleHeadMove: 0.0,
        avatarSpeakingEyeContact: 0.99,
        avatarSpeakingHeadMove: 0.0
      });

      try {
        await head.showAvatar({
          url: "./talkinghead/avatars/interviewer.glb",
          body: "M",
          avatarMood: "neutral",
          lipsyncLang: "en",
          avatarSpeakingEyeContact: 0.99,
          avatarIdleHeadMove: 0.0,
          avatarSpeakingHeadMove: 0.0,
          baseline: {
            headRotateX: -0.02,
            eyeBlinkLeft: 0.1,
            eyeBlinkRight: 0.1
          }
        }, (event) => {
          if (event.lengthComputable) {
            loading.textContent = `Loading interviewer ${Math.min(100, Math.round(event.loaded / event.total * 100))}%`;
          }
        });
        ready = true;
        loading.style.display = "none";
        parent.postMessage({ source: "interviewmate-talkinghead", type: "ready" }, "*");
      } catch (error) {
        loading.textContent = `Avatar failed: ${error}`;
        parent.postMessage({ source: "interviewmate-talkinghead", type: "error", error: String(error) }, "*");
      }
    }

    async function speak(text, durationMs, envelope, frameMs) {
      if (!ready || !head || !text) return;
      try {
        head.stopSpeaking?.();
      } catch (_) {}
      setStateLabel("speaking");
      if (Array.isArray(envelope) && envelope.length > 1) {
        animateFromEnvelope(text, envelope, frameMs || 45);
      } else {
        animateVisemesFromText(text, durationMs);
      }
    }

    // Audio-driven lip-sync: jaw/mouth opening follows the REAL audio amplitude
    // envelope (one value per frameMs), so open/close lines up with the voice
    // sample-accurately; vowel SHAPES are layered from the text on top.
    function animateFromEnvelope(text, envelope, frameMs) {
      clearMouth();
      const n = envelope.length;
      const total = n * frameMs;
      // light smoothing
      const env = envelope.map((v, i) => {
        const a = envelope[Math.max(0, i - 1)];
        const c = envelope[Math.min(n - 1, i + 1)];
        return (a + 2 * v + c) / 4;
      });
      let mx = 0.0001;
      for (const v of env) if (v > mx) mx = v;
      // drive jawOpen + mouthOpen from amplitude, frame by frame
      for (let i = 0; i < n; i++) {
        const open = Math.min(1, env[i] / mx);
        const at = i * frameMs;
        visemeTimers.push(window.setTimeout(() => {
          if (!head) return;
          const speaking = open > 0.07;
          const jawVal = speaking ? 0.04 + open * 0.18 : 0.0;
          head.setFixedValue("jawOpen", jawVal, Math.max(30, frameMs));
          head.setFixedValue("mouthOpen", speaking ? open * 0.13 : 0.0, Math.max(30, frameMs));
        }, at));
      }
      // overlay vowel/consonant SHAPES from the text (no jaw/mouth here — envelope owns those)
      const timing = wordsFromText(text, total);
      timing.words.forEach((word, index) => {
        let seq;
        try { seq = head.lipsyncWordsToVisemes(head.lipsyncPreProcessText(word, "en"), "en"); }
        catch (_) { seq = null; }
        if (!seq?.visemes?.length) return;
        const wStart = timing.wtimes[index];
        const wDur = timing.wdurations[index];
        const seqEnd = seq.times[seq.times.length - 1] + seq.durations[seq.durations.length - 1];
        const scale = seqEnd > 0 ? wDur / seqEnd : 1;
        seq.visemes.forEach((vis, vi) => {
          if (vis === "sil") return;
          const name = `viseme_${vis}`;
          const at = wStart + seq.times[vi] * scale;
          const hold = Math.max(70, seq.durations[vi] * scale);
          const cfg = visemeConfig[vis] || { value: 0.40 };
          visemeTimers.push(window.setTimeout(() => {
            if (!head) return;
            head.setFixedValue(name, cfg.value, 70);
            if (vis === "O" || vis === "U") {
              head.setFixedValue("mouthFunnel", 0.15, 70);
              head.setFixedValue("mouthPucker", vis === "U" ? 0.20 : 0.10, 70);
            }
          }, Math.max(0, at)));
          visemeTimers.push(window.setTimeout(() => {
            if (!head) return;
            head.setFixedValue(name, null, 90);
            head.setFixedValue("mouthFunnel", null, 90);
            head.setFixedValue("mouthPucker", null, 90);
          }, Math.max(0, at + hold)));
        });
      });
      window.__speakingTimer = window.setTimeout(() => { clearMouth(); showStatus(false); }, total + 250);
    }

    function stop() {
      try {
        head?.stopSpeaking?.();
      } catch (_) {}
      clearMouth();
      setStateLabel("idle");
    }

    function listen() {
      clearMouth();
      setStateLabel("listening");
    }

    function think() {
      clearMouth();
      setStateLabel("thinking");
    }

    window.addEventListener("message", (event) => {
      const message = event.data || {};
      if (message.source !== "interviewmate-flutter") return;
      if (message.type === "speak") speak(message.text, message.durationMs, message.envelope, message.frameMs);
      if (message.type === "stop") stop();
      if (message.type === "listen") listen();
      if (message.type === "think") think();
      if (message.type === "idle") stop();
    });

    document.addEventListener("visibilitychange", () => {
      if (!head) return;
      if (document.visibilityState === "visible") head.start();
      else head.stop();
    });

    init();
  </script>
</body>
</html>
